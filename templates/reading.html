<!doctype html>
<html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{TITLE}}</title>
<style>
:root{--navy:#192B43;--deep:#111629;--teal:#57A7B3;--pink:#EC6A87;--gold:#B18A49;--pale:#EFF6F6;--muted:#647080}
*{box-sizing:border-box}html{background:#e9eeee}body{margin:0;color:var(--navy);font:10.5pt/1.4 Arial,sans-serif}.page{position:relative;background:white;padding:15.5mm 20.5mm 20mm;width:210mm;min-height:297mm;margin:8mm auto;box-shadow:0 2px 14px #0002;border-right:6mm solid var(--pale)}
.page:after{content:"";position:absolute;right:-6mm;top:calc(100% * var(--page-index) / var(--page-count));width:6mm;height:calc(100% / var(--page-count));background:var(--pink)}.masthead{height:32mm;background:var(--deep);margin:-15.5mm -20.5mm 4mm;display:flex;align-items:center;justify-content:center;position:relative;z-index:3;width:210mm}.masthead img{width:28mm;height:21mm;object-fit:contain}.identity{text-align:center}.tagline{font-size:8.5pt;color:var(--muted);margin:0 0 5pt}.number{font:68pt/.95 Georgia,serif;color:var(--gold);margin:6pt 0 5pt}.title{font:27pt/1.4 Georgia,serif;margin:7pt 0}.energy{font:bold 14pt/1.4 Georgia,serif;margin:6pt 0 5pt}.keywords{font-size:11pt;font-style:italic;color:var(--muted);margin:5pt 0 7pt}.opening{font:italic 13pt/1.3 Georgia,serif;margin:8pt 0}
p{margin:0 0 7pt;orphans:3;widows:3}h2{font:bold 17pt/1.4 Georgia,serif;margin:10pt 0 7pt;break-after:avoid}h3{font:bold 14pt/1.4 Georgia,serif;margin:6pt 0 5pt;break-after:avoid}.label{font:8.5pt/1.3 Arial,sans-serif;color:var(--muted);margin:0 0 8pt;break-after:avoid}.quote{font:italic 13pt/1.3 Georgia,serif;background:var(--pale);padding:3pt 6pt;margin:0 0 8pt;break-inside:avoid}.card{font-size:10pt;line-height:1.3;background:var(--pale);padding:3pt 6pt;margin:0;break-inside:avoid}.crystals{display:grid;grid-template-columns:1fr 1fr;gap:5mm;background:#FAF8F3;padding:2mm;break-inside:avoid}.crystal img{width:56mm;height:32mm;object-fit:contain;max-width:100%;display:block;margin:0 auto 3mm}.crystal p{font-size:10pt;line-height:1.3}.photo-credit{font-size:7.5pt!important;line-height:1.3!important;color:var(--muted)}.photo-credit a{text-decoration:underline}.crystal .quote{background:none;font-size:13pt;padding:0}.gallery{display:flex;justify-content:space-around;gap:6mm;margin:0 0 7pt;break-inside:avoid}.gallery img{height:56mm;width:42mm;object-fit:contain}a{color:var(--navy);text-decoration:none}.link{font-size:10pt;padding:3pt 6pt;background:var(--pale);margin:0 0 7pt}.running{display:none}
.closing-note{font:italic 13pt/1.5 Georgia,serif;text-align:center;color:var(--navy);margin:18pt 0 0;padding:10pt 4pt 0;border-top:.5pt solid var(--teal);break-inside:avoid}

.page:has(.offer) h2.heading{font:27pt/1.12 Georgia,serif;margin:0 0 4mm}
.page:has(.offer)>p.text{margin-bottom:7mm}
.offer{border:1px solid #BADADD;border-radius:3mm;padding:6mm;margin:0 0 6mm;break-inside:avoid;background:var(--pale)}
.offer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:7mm;margin-bottom:3mm}
.offer .offer-title{font:bold 17pt/1.2 Georgia,serif;margin:1mm 0 0;max-width:111mm}
.offer-price{text-align:right;flex-shrink:0;min-width:29mm}.offer-price strong{font:bold 29pt/1 Georgia,serif;white-space:nowrap;display:block}
.offer-regular{font:8pt Arial,sans-serif;color:var(--muted);display:block;margin-top:2mm;white-space:nowrap}.offer-regular s{margin-left:1mm}
.offer .offer-desc{margin:0 0 4mm;font:10.5pt/1.45 Arial,sans-serif}
.offer-photo-area{display:flex;gap:5mm;align-items:center;margin-bottom:4mm}.offer-photos{display:flex;gap:4mm;flex-shrink:0}.offer-photos img{height:36mm;width:27mm;object-fit:contain;border-radius:1.5mm}
.offer .offer-caption{font:8.5pt/1.5 Arial,sans-serif;color:var(--muted);margin:0;max-width:67mm}
.offer .offer-cta{display:inline-block;background:var(--navy);color:white;padding:2.8mm 4.5mm;border-radius:1mm;font:9pt/1.2 Arial,sans-serif;text-decoration:none}
@media screen and (max-width:650px){.offer-head{gap:3mm}.offer .offer-title{font-size:15pt}.offer-price strong{font-size:25pt}.offer-photo-area{flex-wrap:wrap}}

@page{size:A4;margin:20.5mm 20.5mm 17mm}
@media print{html{background:white}body{print-color-adjust:exact;-webkit-print-color-adjust:exact}.page{width:auto;min-height:0;margin:0;padding:0 4mm 0 0;border:0;background:transparent;box-shadow:none;break-before:page}.page:first-of-type{break-before:auto}.page:after{display:none}.stripe{display:none}.stripe:after{content:"";position:absolute;top:0;width:1.5mm;height:5mm;background:var(--pink)}.running{display:none}.masthead{margin:0 0 4mm;width:100%;height:28mm}.page a{overflow-wrap:anywhere}}
@media screen and (max-width:800px){.page{width:100%;min-height:0;margin:0 0 12px;padding:18px 22px;border-right:5px solid var(--pale)}.page:after{right:-5px;width:5px}.masthead{width:calc(100% + 44px);margin:-18px -22px 16px}.crystals{grid-template-columns:1fr}.gallery img{max-width:45%;height:auto}.title{font-size:25pt}}
</style></head><body><div class="stripe"></div><div class="running"><span>VAIMURAAMAT</span><span>Punkt A · {{NUMBER}}</span></div>{{BODY}}</body></html>
